<style>

  }

  body {

  .progress {

    background: var(--line);

  .choice {

    gap: 12px;

  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .choice input { margin: 0; accent-color: var(--accent); }
  .choice .count { margin-left: auto; color: var(--muted); font-size: 14px; }
  .toggle { display: flex; align-items: center; gap: 10px; margin: 8px 0; cursor: pointer; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .score { font-family: "Newsreader", Georgia, serif; font-size: 40px; line-height: 1.1; font-weight: 500; margin: 8px 0 4px; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .errors { list-style: none; padding: 0; margin: 12px 0 0; }
  .errors li { padding: 12px 0; border-top: 1px solid var(--line); }
  .errors .q { font-family: "Newsreader", Georgia, serif; font-size: 18px; margin-bottom: 4px; }
  .errors .yours { color: var(--bad); }
  .errors .right { color: var(--ok); }
  .errors .lesson { color: var(--muted); font-size: 14px; }
  @media (max-width: 480px) {
    main { padding: 20px 14px 56px; }
    .card { padding: 20px 16px 18px; }
    h1 { font-size: 26px; }
    .question { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .opt, .progress > div { transition: none; }
  }
  [hidden] { display: none !important; }
</style>

<body>
<main>
  <header>
    <h1>Economia delle produzioni zootecniche</h1>
    <p class="sub">Quiz di autovalutazione sulle lezioni 1, 2 e 3. La risposta corretta compare subito dopo la scelta.</p>
  </header>

  <section id="start" class="card">
    <h2>Scegli cosa ripassare</h2>
    <div class="choices" id="lessonChoices"></div>
    <label class="toggle"><input type="checkbox" id="randomOrder"> Ordine casuale delle domande</label>
    <label class="toggle"><input type="checkbox" id="shuffleOpts" checked> Mescola l’ordine delle risposte</label>
    <div class="actions">
      <button class="btn" id="startBtn">Inizia il quiz</button>
    </div>
    <p class="hint">Da tastiera: 1-4 per rispondere, Invio per passare alla domanda successiva.</p>
  </section>

  <section id="quiz" hidden>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    <div class="card">
      <div class="meta">
        <span id="lessonTag"></span>
        <span id="counter"></span>
      </div>
      <p class="question" id="qText"></p>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback" hidden aria-live="polite">
        <p class="verdict" id="verdict"></p>
        <p id="explain"></p>
        <p class="ref" id="ref"></p>
      </div>
      <div class="actions" id="nextActions" hidden>
        <button class="btn" id="nextBtn">Avanti</button>
      </div>
    </div>
  </section>

  <section id="results" class="card" hidden>
    <h2>Risultato</h2>
    <p class="score" id="scoreLine"></p>
    <p class="sub" id="scoreSub"></p>
    <table id="byLesson"></table>
    <div id="errorsWrap">
      <h2 style="font-size:20px;margin-top:20px">Domande sbagliate</h2>
      <ul class="errors" id="errors"></ul>
    </div>
    <div class="actions">
      <button class="btn" id="retryErrors">Ripeti le domande sbagliate</button>
      <button class="btn secondary" id="restart">Torna all’inizio</button>
    </div>
  </section>
</main>

<script>
const LESSONS = {
  1: "Il sistema zootecnico italiano",
  2: "Il sistema zootecnico europeo",
  3: "Dinamiche di consumo"
};

// Ogni voce: l = lezione, q = domanda, o = opzioni, a = indice della risposta corretta, e = spiegazione, s = slide di riferimento
const BANK = [
  // ---------- LEZIONE 1: IL SISTEMA ZOOTECNICO ITALIANO ----------
  {l:1, q:"Secondo i dati presentati, quante sono le imprese agricole in Italia?", o:["Circa 189.500","Circa 872.000","Circa 1.145.700","Circa 2.300.000"], a:2, e:"Le imprese agricole sono 1.145.705; le aziende con allevamenti sono 189.531 e gli occupati 872.000.", s:"slide 2"},
  {l:1, q:"Quante sono le aziende italiane con allevamenti?", o:["Circa 109.000","Circa 189.500","Circa 26.600","Circa 1.145.000"], a:1, e:"189.531 aziende con allevamenti su 1.145.705 imprese agricole. 109.000 sono le sole aziende con bovini, 26.600 quelle suinicole.", s:"slide 2"},
  {l:1, q:"Quale quota degli occupati totali italiani lavora in agricoltura?", o:["1,2%","3,8%","9%","14%"], a:1, e:"872.000 occupati, pari al 3,8% del totale nazionale.", s:"slide 2"},
  {l:1, q:"Quanto vale il valore aggiunto agricolo italiano e quale quota del PIL rappresenta?", o:["16 Mrd€, 1% del PIL","33,1 Mrd€, 2,1% del PIL","42 Mrd€, 9% del PIL","50 Mrd€, 4% del PIL"], a:1, e:"VA agricolo 33,1 Mrd€, pari al 2,1% del PIL. 42 Mrd€ è invece il valore dell’export (9% dell’export totale).", s:"slide 2"},
  {l:1, q:"A quanto ammonta l’export agroalimentare italiano e quale quota dell’export totale rappresenta?", o:["16 Mrd€, 3%","33,1 Mrd€, 2,1%","42 Mrd€, 9%","6,3 Mrd€, 1%"], a:2, e:"Export 42 Mrd€, pari al 9% dell’export totale italiano.", s:"slide 2"},
  {l:1, q:"Quale percentuale delle aziende agricole italiane è condotta da donne e quale da giovani imprenditori?", o:["10% donne, 30% giovani","30% donne, 10% giovani","50% donne, 5% giovani","20% donne, 20% giovani"], a:1, e:"Il 30% delle aziende è condotto da donne e il 10% da giovani imprenditori: valori in linea con la media europea.", s:"slide 2"},
  {l:1, q:"Qual è la consistenza del patrimonio bovino italiano?", o:["1,8 milioni di capi","5,7 milioni di capi","8,4 milioni di capi","7 milioni di capi"], a:1, e:"5,7 milioni di bovini, di cui 1,8 milioni di vacche da latte.", s:"slide 2"},
  {l:1, q:"Quante sono le vacche da latte in Italia?", o:["1 milione","1,8 milioni","3,5 milioni","5,7 milioni"], a:1, e:"1,8 milioni di vacche da latte su 5,7 milioni di bovini.", s:"slide 2"},
  {l:1, q:"Qual è la consistenza del patrimonio suino italiano?", o:["5,7 milioni di capi","7 milioni di capi","8,4 milioni di capi","12 milioni di capi"], a:2, e:"8,4 milioni di suini (7 milioni sono gli ovini, 5,7 milioni i bovini).", s:"slide 2"},
  {l:1, q:"Quanti sono ovini e caprini in Italia?", o:["7 milioni di ovini e 1 milione di caprini","1 milione di ovini e 7 milioni di caprini","3 milioni di ovini e 3 milioni di caprini","12 milioni di ovini e 2 milioni di caprini"], a:0, e:"7 milioni di ovini e 1 milione di caprini: la specie ovina rappresenta circa l’80% del comparto ovi-caprino.", s:"slide 2"},
  {l:1, q:"Qual è la consistenza del patrimonio avicolo italiano?", o:["58 milioni di capi","158 milioni di capi","8,4 milioni di capi","1,5 miliardi di capi"], a:1, e:"158 milioni di avicoli secondo la scheda introduttiva; la sezione sull’allevamento avicolo (dati Istat) parla di circa 165 milioni.", s:"slide 2 e 31"},
  {l:1, q:"Quanti prodotti alimentari DOP-IGP conta l’Italia e che posizione occupa in Europa?", o:["331, primo Paese in Europa","527, primo Paese in Europa","331, secondo Paese dopo la Francia","189, terzo Paese"], a:0, e:"331 DOP-IGP food, primo Paese in Europa. I vini DOP-IGP sono 527 e valgono 7,4 mld€.", s:"slide 3"},
  {l:1, q:"Quanti sono i vini DOP-IGP italiani e quanto valgono?", o:["331 vini, 6,3 mld€","527 vini, 7,4 mld€","527 vini, 13,3 mld€","331 vini, 3,1 mld€"], a:1, e:"527 vini DOP-IGP per 7,4 mld€.", s:"slide 3"},
  {l:1, q:"Qual è il valore al consumo dei prodotti food DOP-IGP italiani?", o:["3,1 mld€","6,3 mld€","13,3 mld€","7,4 mld€"], a:2, e:"Valore all’origine 6,3 mld€, al consumo 13,3 mld€, export 3,1 mld€.", s:"slide 3"},
  {l:1, q:"Quanto vale la SAU biologica italiana e quale quota della SAU nazionale rappresenta?", o:["1,8 mln ha, 14% della SAU (12,4 mln ha)","12,4 mln ha, 14%","1,8 mln ha, 39%","3,5 mln ha, 28%"], a:0, e:"SAU biologica 1,8 mln ha, pari al 14% della SAU italiana (12,4 mln ha), con una crescita del 56% nel decennio.", s:"slide 3"},
  {l:1, q:"Quanti sono gli agriturismi in Italia secondo le slide?", o:["Circa 2.600","Circa 12.400","Circa 22.600","Circa 42.000"], a:2, e:"22.661 agriturismi, +35% nel periodo 2006-2016.", s:"slide 3"},
  {l:1, q:"Chi detiene e aggiorna l’elenco nazionale delle certificazioni di qualità (DOP-IGP)?", o:["L’Istat","Il Ministero dell’Agricoltura","Le Regioni","La Commissione Europea"], a:1, e:"L’elenco nazionale è tenuto dal Ministero dell’Agricoltura (MASAF); quello europeo dalla Commissione Europea (registro eAmbrosia).", s:"slide 4"},
  {l:1, q:"Che cosa significa che il sistema agroalimentare svolge una funzione anticiclica?", o:["Che i suoi prezzi seguono l’inflazione generale","Che cresce o resiste nelle fasi di crisi in cui il resto dell’economia si contrae","Che la produzione segue i cicli stagionali","Che dipende interamente dai contributi pubblici"], a:1, e:"Tra il 2008 e il 2016 (anni di crisi) il VA dell’industria alimentare è cresciuto del 13,5% e quello agroalimentare dell’8,1%, contro il +2,4% dell’intera economia e il calo di manifattura, tessile e costruzioni.", s:"slide 5"},
  {l:1, q:"Tra il 2008 e il 2016, quale settore ha registrato la maggiore crescita del valore aggiunto (prezzi correnti)?", o:["Industria manifatturiera","Costruzioni","Industria alimentare","Tessile-abbigliamento"], a:2, e:"Industria alimentare +13,5%, agroalimentare +8,1%, agricoltura +3,8%, totale economia +2,4%; manifattura -2,6%, tessile-abbigliamento -4,7%, costruzioni -18,9%.", s:"slide 5"},
  {l:1, q:"Tra il 2008 e il 2016 il valore aggiunto dell’agricoltura è variato di circa:", o:["-2,6%","+2,4%","+3,8%","+13,5%"], a:2, e:"Agricoltura +3,8%, più del +2,4% dell’economia nel suo complesso.", s:"slide 5"},
  {l:1, q:"Quale evento recente è citato come esempio della funzione anticiclica del sistema agroalimentare?", o:["La crisi del debito del 2011","La pandemia di Covid-19","La Brexit","La crisi dei mutui subprime"], a:1, e:"Articolo del Sole 24 Ore del 6 novembre 2020: «Il sistema agroalimentare resiste al Covid: luci e ombre di questa pandemia».", s:"slide 6"},
  {l:1, q:"Quale dei seguenti NON è tra i fattori di influenza dello scenario evolutivo del sistema agroalimentare indicati nelle slide?", o:["Cambiamenti climatici","Aumento della popolazione mondiale","Riduzione della domanda di prodotti certificati","PAC post 2020 e accordi di libero scambio"], a:2, e:"I sei fattori: cambiamenti climatici; risorse naturali sempre più scarse da preservare; aumento della popolazione mondiale; cambiamenti socio-demografici e di consumo; PAC post 2020 e accordi di libero scambio; innovazione tecnologica.", s:"slide 7"},
  {l:1, q:"Quanto vale la produzione primaria zootecnica italiana e quale quota del settore primario rappresenta?", o:["Circa 16 mld€, un terzo del settore primario (circa 50 mld€)","Circa 50 mld€, un terzo del PIL","Circa 4,2 mld€, il 60% del settore primario","Circa 33 mld€, due terzi del settore primario"], a:0, e:"Circa 16 mld€, pari a circa un terzo dell’intero settore primario nazionale (circa 50 mld€).", s:"slide 8"},
  {l:1, q:"In quali regioni si trovano i due terzi dei capi allevati in Italia?", o:["Lombardia, Veneto, Emilia-Romagna e Piemonte","Sardegna, Sicilia, Lazio e Campania","Lombardia, Toscana, Puglia e Sicilia","Veneto, Friuli, Trentino e Liguria"], a:0, e:"Due terzi dei capi si trovano in Lombardia, Veneto, Emilia-Romagna e Piemonte.", s:"slide 8"},
  {l:1, q:"In Lombardia, quale quota della produzione primaria regionale è rappresentata dalla zootecnia?", o:["19,9%","37%","39%","60%"], a:3, e:"Lombardia 60% (4,2 mld€, di cui 1,6 mld€ da latte vaccino); Emilia-Romagna e Veneto 39%; Piemonte 37%; Abruzzo 19,9%.", s:"slide 8 e 12"},
  {l:1, q:"Quale quota del patrimonio nazionale di bovine da latte è allevata in Lombardia?", o:["Circa un decimo","Circa un quinto","Circa un terzo","Circa due terzi"], a:2, e:"Un terzo delle bovine da latte (36% secondo i dati SPA 2013); la Lombardia detiene inoltre il 27% del patrimonio bovino nazionale.", s:"slide 8 e 25"},
  {l:1, q:"Qual è la prima voce in valore della produzione zootecnica dell’Emilia-Romagna?", o:["Carne suina","Latte vaccino","Pollame","Uova"], a:1, e:"Latte vaccino 722 mln€, pollame 600, carne suina 490, carne bovina 300, uova 280: una zootecnia particolarmente articolata.", s:"slide 9"},
  {l:1, q:"Quale regione ha una zootecnia più orientata alla carne, con il pollame come prima voce (770 mln€)?", o:["Emilia-Romagna","Lombardia","Veneto","Abruzzo"], a:2, e:"Veneto: pollame 770, carne bovina 433, carne suina 182 mln€. Anche il Piemonte è specializzato nella carne (bovina 445, suina 254 mln€).", s:"slide 10 e 11"},
  {l:1, q:"In Abruzzo la zootecnia rappresenta quale quota della produzione primaria regionale?", o:["19,9%","37%","39%","60%"], a:0, e:"19,9%: carni 220 mln€, uova 38, latte 29.", s:"slide 12"},
  {l:1, q:"Quanti prodotti DOP-IGP vanta la Lombardia?", o:["23 (12 DOP e 11 IGP)","34 (21 DOP e 13 IGP)","36 (18 DOP e 18 IGP)","43"], a:1, e:"34 prodotti certificati, di cui 21 DOP e 13 IGP (36 è il Veneto, 43 l’Emilia-Romagna, 23 il Piemonte).", s:"slide 13"},
  {l:1, q:"Quale regione, tra quelle analizzate, conta il maggior numero di prodotti DOP e IGP?", o:["Lombardia (34)","Veneto (36)","Emilia-Romagna (43)","Piemonte (23)"], a:2, e:"Emilia-Romagna 43; Veneto 36 (18 DOP e 18 IGP); Lombardia 34; Piemonte 23; Abruzzo 8.", s:"slide 13-17"},
  {l:1, q:"Quanti prodotti DOP-IGP ha l’Abruzzo e quanti di questi sono zootecnici?", o:["8, di cui 3 zootecnici","23, di cui 10 zootecnici","8, tutti zootecnici","3, nessuno zootecnico"], a:0, e:"8 DOP-IGP di cui 3 zootecnici: Agnello del Centro Italia IGP, Salamini italiani alla cacciatora DOP, Vitellone bianco dell’Appennino centrale IGP (tutti interregionali).", s:"slide 17"},
  {l:1, q:"Quale dei seguenti NON è un formaggio DOP lombardo?", o:["Bitto","Taleggio","Castelmagno","Quartirolo Lombardo"], a:2, e:"Il Castelmagno è un DOP piemontese. Bitto, Quartirolo Lombardo e Taleggio (interregionale) sono tra i formaggi DOP della Lombardia.", s:"slide 13 e 16"},
  {l:1, q:"Quale quota del valore della produzione zootecnica italiana è rappresentata dalle carni e quale dal latte?", o:["Carni 31%, latte 60%","Carni 60%, latte 31%","Carni 45%, latte 45%","Carni 75%, latte 20%"], a:1, e:"Su circa 17 mld€: carni 10.289 mln€ (poco più del 60%), latte 5.257 mln€ (circa 31%), uova 1.392, miele 43, prodotti non alimentari 11.", s:"slide 18"},
  {l:1, q:"Dopo carni e latte, qual è la terza voce in valore della produzione zootecnica italiana?", o:["Miele","Uova","Prodotti non alimentari","Lana"], a:1, e:"Uova 1.392 mln€; il miele vale 43 mln€ e i prodotti non alimentari 11 mln€.", s:"slide 18"},
  {l:1, q:"Lombardia, Piemonte, Veneto ed Emilia-Romagna realizzano, secondo le slide, quale quota del valore della produzione zootecnica nazionale?", o:["Meno del 20%","Più del 40%","Esattamente il 50%","Oltre il 90%"], a:1, e:"Più del 40%; il resto è realizzato dall’insieme delle altre 16 regioni. La sola Lombardia incide per il 32,1% del latte e il 24,1% delle carni.", s:"slide 22"},
  {l:1, q:"Confrontando Sardegna e Veneto, che cosa emerge dalla lettura critica dei dati su aziende e capi?", o:["In Sardegna ci sono poche aziende molto grandi","In Sardegna ci sono moltissime aziende con pochissimi capi; il Veneto ha circa 5.000 aziende in meno e un numero di capi 400 volte superiore","Le due regioni hanno dimensioni aziendali simili","Il Veneto ha più aziende ma meno capi"], a:1, e:"Il confronto mostra la diversa dimensione media aziendale. Il dato veneto va letto alla luce della grande presenza di avicoli.", s:"slide 20 e 21"},
  {l:1, q:"Tra il 2000 e il 2010 il numero di aziende con allevamenti è variato di:", o:["-6%","-32%","-41%","+18%"], a:2, e:"Intero settore agricolo -32%; aziende zootecniche -41%; capi in UBA solo -6%: segno di una ristrutturazione con aumento della dimensione media aziendale.", s:"slide 23"},
  {l:1, q:"Che cosa si intende per ristrutturazione di un settore zootecnico?", o:["La conversione delle aziende al biologico","La riduzione del numero di aziende con una riduzione minore (o nulla) dei capi, cioè l’aumento della dimensione media aziendale","L’aumento del numero di aziende e dei capi","Il passaggio dalla produzione di carne a quella di latte"], a:1, e:"Meno aziende, capi quasi invariati: cresce la dimensione media. Il fenomeno è proseguito anche dopo il 2010 (dati SPA 2013).", s:"slide 23 e 24"},
  {l:1, q:"Secondo l’indagine SPA 2013, quale settore aveva il maggior numero medio di capi per azienda?", o:["Suini (324)","Conigli (902)","Allevamenti avicoli (8.878)","Bufalini (158)"], a:2, e:"Avicoli 8.878 capi per azienda; seguono conigli 902, suini 324, bufalini 158, ovini 112, bovini 49.", s:"slide 24"},
  {l:1, q:"Tra il 2010 e il 2013 quali settori hanno visto AUMENTARE il numero di aziende (+18%)?", o:["Bovini e vacche da latte","Ovini e caprini","Equini e conigli","Avicoli e suini"], a:1, e:"Ovini +18% aziende (capi -1%), caprini +18% (capi +10%). In calo bovini -12%, vacche da latte -19%, equini -23%, avicoli -22%, conigli -18%.", s:"slide 24"},
  {l:1, q:"Quante sono le aziende con allevamenti bovini e quale quota delle aziende zootecniche rappresentano?", o:["Circa 26.600, il 14%","Circa 109.000, circa il 60%","Circa 18.500, il 10%","Circa 60.000, il 32%"], a:1, e:"Circa 109.000 aziende (60% delle aziende zootecniche); il 37% di esse alleva bovini da latte.", s:"slide 25"},
  {l:1, q:"Tra il 2005 e il 2015 le consistenze bovine italiane sono variate di:", o:["+8%","-8%","-41%","+20%"], a:1, e:"-8%, con andamenti diversi tra le regioni.", s:"slide 27"},
  {l:1, q:"Quale regione detiene la quota maggiore del patrimonio bovino italiano?", o:["Veneto","Piemonte","Lombardia","Emilia-Romagna"], a:2, e:"Lombardia circa 27%, Veneto e Piemonte circa 14% ciascuno, Emilia-Romagna circa 10%, Sicilia circa 6%.", s:"slide 25 e 26"},
  {l:1, q:"Quante sono le aziende suinicole e quale quota delle aziende zootecniche rappresentano?", o:["Circa 26.600, il 14%","Circa 109.000, il 60%","Circa 18.500, il 10%","Circa 40.000, il 21%"], a:0, e:"Circa 26.600 aziende suinicole, il 14% delle aziende zootecniche.", s:"slide 28"},
  {l:1, q:"Dove si trova l’80% dei capi suini italiani?", o:["Sardegna, Campania, Sicilia e Calabria","Piemonte, Lombardia, Emilia-Romagna e Veneto","Lazio, Toscana, Umbria e Marche","Puglia, Basilicata, Molise e Abruzzo"], a:1, e:"Piemonte, Lombardia, Emilia-Romagna e Veneto; la sola Lombardia alleva circa il 50% dei suini. Per numero di aziende prevalgono invece Sardegna, Campania, Veneto e Lombardia.", s:"slide 28"},
  {l:1, q:"Per numero di aziende, l’allevamento suino è localizzato principalmente in:", o:["Sardegna, Campania, Veneto e Lombardia","Piemonte, Lombardia, Emilia-Romagna e Veneto","Lombardia, Veneto ed Emilia-Romagna","Sicilia, Puglia, Calabria e Basilicata"], a:0, e:"Molte aziende piccole al Sud e nelle isole; i capi sono però concentrati per l’80% nelle quattro regioni del Nord.", s:"slide 28"},
  {l:1, q:"Come si è manifestata la ristrutturazione del settore suino tra il 2010 e il 2013?", o:["Capi -8% e numero di aziende leggermente aumentato","Capi +8% e aziende -41%","Capi e aziende entrambi -20%","Capi invariati e aziende dimezzate"], a:0, e:"Riduzione dei capi dell’8% ma, a differenza del settore bovino, aziende in leggero aumento.", s:"slide 29"},
  {l:1, q:"Quante sono le aziende avicole e quanti capi allevano circa?", o:["Oltre 18.500 aziende, circa 165 milioni di capi","Circa 26.600 aziende, 8,4 milioni di capi","Circa 109.000 aziende, 58 milioni di capi","Circa 2.400 aziende, 39 milioni di capi"], a:0, e:"Oltre 18.500 aziende avicole per circa 165 milioni di capi.", s:"slide 31"},
  {l:1, q:"Quale regione ha il maggior numero di aziende avicole, pur allevando solo il 2% dei capi?", o:["Veneto","Emilia-Romagna","Campania","Lombardia"], a:2, e:"La Campania ha più aziende avicole di tutte ma alleva soltanto il 2% degli avicoli.", s:"slide 31"},
  {l:1, q:"Dove si trovano gli allevamenti avicoli più grandi (circa 39.000 capi per azienda)?", o:["Veneto","Emilia-Romagna","Campania","Sardegna"], a:1, e:"Emilia-Romagna, con un patrimonio di circa 39.000 capi per azienda.", s:"slide 31"},
  {l:1, q:"Quali tre regioni allevano oltre il 60% dei capi avicoli italiani?", o:["Lombardia, Veneto ed Emilia-Romagna","Campania, Puglia e Sicilia","Piemonte, Liguria e Valle d’Aosta","Lazio, Marche e Umbria"], a:0, e:"Lombardia, Veneto ed Emilia-Romagna. Il Veneto da solo alleva circa il 30% del patrimonio avicolo e il 31% dei polli da carne.", s:"slide 31-33"},
  {l:1, q:"Quale regione concentra la quota maggiore di galline ovaiole?", o:["Veneto (11,6%)","Lombardia (23%)","Emilia-Romagna (34,5%)","Campania (2,2%)"], a:2, e:"Emilia-Romagna 34,5%, Lombardia 23%, Veneto 11,6%. Per i polli da carne la prima regione è invece il Veneto (30,9%).", s:"slide 34 e 35"},
  {l:1, q:"Nell’allevamento ovi-caprino italiano la specie ovina rappresenta circa:", o:["Il 50% dei capi","L’80% dei capi","Il 20% dei capi","Il 95% dei capi"], a:1, e:"L’allevamento ovi-caprino è composto prevalentemente da ovini (80% del totale).", s:"slide 36"},
  {l:1, q:"Quale quota dei capi ovi-caprini e delle aziende si trova in Sardegna?", o:["42% dei capi e 17% delle aziende","17% dei capi e 42% delle aziende","25% dei capi e 25% delle aziende","11% dei capi e 9% delle aziende"], a:0, e:"Sardegna 42% dei capi e 17% delle aziende; Sicilia 11% delle aziende, Lazio 9%. L’allevamento è localizzato soprattutto nelle isole e nel Lazio.", s:"slide 36"},
  {l:1, q:"Quale regione ha il maggior numero di caprini?", o:["Calabria (15%)","Sardegna (25%)","Sicilia (13%)","Lombardia (11%)"], a:1, e:"Sardegna 25%, Calabria 15%, Sicilia 13%, Lombardia 11%.", s:"slide 38"},
  {l:1, q:"Come si è manifestata la ristrutturazione del settore ovi-caprino tra il 2010 e il 2013?", o:["Riduzione delle aziende e aumento dei capi per azienda","Aumento delle aziende e diminuzione del numero medio di capi per azienda","Riduzione sia delle aziende sia dei capi","Nessuna variazione"], a:1, e:"Una ristrutturazione a discapito delle aziende di grandi dimensioni, di segno opposto a quella di bovini e suini.", s:"slide 38"},
  {l:1, q:"A quale causa è in parte attribuita la forte riduzione delle consistenze ovi-caprine tra il 2005 e il 2015?", o:["Alla peste suina","Alla blue tongue","All’influenza aviaria","Alla BSE"], a:1, e:"Una parte delle perdite è legata alle morti causate dalla blue tongue.", s:"slide 39"},

  // ---------- LEZIONE 2: IL SISTEMA ZOOTECNICO EUROPEO ----------
  {l:2, q:"Quanti ettari di SAU sono utilizzati per l’agricoltura nell’UE e quale quota del territorio europeo rappresentano?", o:["12,4 mln ha, 14%","173 mln ha, 39%","309 mln ha, 50%","88 mln ha, 25%"], a:1, e:"173 milioni di ettari, pari al 39% del territorio UE. La SAU italiana è di 12,4 mln ha, di cui 1,8 mln biologici.", s:"slide 4"},
  {l:2, q:"Quanti sono gli agricoltori (aziende agricole) nell’UE?", o:["1,1 milioni","4 milioni","10,5 milioni","28 milioni"], a:2, e:"10,5 milioni di agricoltori; due terzi delle aziende hanno meno di 5 ha.", s:"slide 4"},
  {l:2, q:"Quali sono le percentuali di uomini, donne e giovani (sotto i 40 anni) tra gli agricoltori europei?", o:["71,5% uomini, 28,5% donne, 11% giovani","50% uomini, 50% donne, 30% giovani","90% uomini, 10% donne, 5% giovani","60% uomini, 40% donne, 20% giovani"], a:0, e:"I valori italiani (30% di aziende condotte da donne, 10% da giovani) sono in linea con la media UE.", s:"slide 4"},
  {l:2, q:"Quale quota delle aziende agricole europee ha una superficie inferiore a 5 ettari e quanta SAU lavora?", o:["Un terzo delle aziende, 50% della SAU","Due terzi delle aziende, 6,1% della SAU","6,9% delle aziende, 68,2% della SAU","Metà delle aziende, 25% della SAU"], a:1, e:"Due terzi delle aziende sono sotto i 5 ha ma lavorano solo il 6,1% della SAU.", s:"slide 7"},
  {l:2, q:"Le aziende con più di 50 ha sono il 6,9% del totale: quale quota della SAU europea lavorano?", o:["6,1%","25%","50%","68,2%"], a:3, e:"«Piccolo è bello... non sempre»: poche grandi aziende lavorano il 68,2% della terra.", s:"slide 7"},
  {l:2, q:"In quali quattro Paesi si trova oltre il 65% delle aziende agricole europee?", o:["Francia, Germania, Spagna e Italia","Romania, Polonia, Italia e Spagna","Romania, Bulgaria, Grecia e Ungheria","Polonia, Germania, Francia e Regno Unito"], a:1, e:"Romania 32,7%, Polonia 13,5%, Italia 10,9%, Spagna 9%.", s:"slide 5"},
  {l:2, q:"Quale Paese ospita da solo circa un terzo delle aziende agricole europee?", o:["Polonia","Italia","Romania","Spagna"], a:2, e:"La Romania conta il 32,7% delle aziende (un terzo degli agricoltori UE) ma produce solo il 3,3% dello standard output europeo.", s:"slide 5 e 11"},
  {l:2, q:"Quale quota delle aziende agricole europee è classificata come azienda a carattere familiare?", o:["50%","75%","93%","96%"], a:3, e:"Il 96% è a carattere familiare e il 93% ha soltanto lavoratori membri della famiglia; la conduzione familiare prevale in tutti gli Stati membri.", s:"slide 6"},
  {l:2, q:"Quale Paese ha il maggior numero di aziende a carattere NON familiare (27,3%)?", o:["Germania","Francia","Regno Unito","Danimarca"], a:1, e:"La Francia, con il 27,3% di aziende non familiari.", s:"slide 6"},
  {l:2, q:"Quale Paese ha la quota più alta di aziende con meno di 5 ha (96,5%)?", o:["Romania","Cipro","Malta","Grecia"], a:2, e:"Malta 96,5%, Romania 91,8%, Cipro 89,6%, Bulgaria 82,6%, Ungheria 81,4%, Grecia 77,3%, Portogallo 71,5%, Croazia 69,5%.", s:"slide 8"},
  {l:2, q:"Oltre che in interi Stati, le aziende di piccole dimensioni (sotto i 5 ha) caratterizzano alcune regioni di altri Paesi. Quali?", o:["Il nord della Germania e la Scandinavia","Il sud della Polonia e le regioni costiere di Spagna e Italia","L’Irlanda e la Scozia","Le pianure francesi"], a:1, e:"Il sud della Polonia e le regioni costiere della Spagna e dell’Italia.", s:"slide 8"},
  {l:2, q:"Quale Paese ha la quota più alta di aziende con SAU superiore a 50 ha?", o:["Francia (41,3%)","Regno Unito (38,6%)","Lussemburgo (51,8%)","Danimarca (35,3%)"], a:2, e:"Lussemburgo 51,8%, Francia 41,3%, Regno Unito 38,6%, Danimarca 35,3%.", s:"slide 9"},
  {l:2, q:"Come possono essere classificate le aziende europee in base al fatturato (produzione standard)?", o:["Aziende di sussistenza, piccole e medie imprese, grandi imprese","Aziende familiari e non familiari","Aziende specializzate e miste","Aziende biologiche e convenzionali"], a:0, e:"Tre classi: aziende di sussistenza, piccole e medie imprese, grandi imprese.", s:"slide 10"},
  {l:2, q:"Quante aziende europee hanno una produzione standard inferiore a 2.000 € l’anno (aziende di sussistenza)?", o:["304.000","3 milioni","4 milioni","10,5 milioni"], a:2, e:"4 milioni di aziende sotto i 2.000 €; 3 milioni nel range 2.000-8.000 €; 304.000 sopra i 250.000 €.", s:"slide 10"},
  {l:2, q:"Quante aziende europee superano i 250.000 € di produzione standard?", o:["Circa 30.000","Circa 304.000","Circa 3 milioni","Circa 4 milioni"], a:1, e:"304.000 grandi imprese.", s:"slide 10"},
  {l:2, q:"In quali quattro Paesi è prodotto il 55,1% dello standard output agricolo europeo?", o:["Francia, Italia, Germania e Spagna","Romania, Polonia, Italia e Spagna","Germania, Regno Unito, Paesi Bassi e Danimarca","Francia, Germania, Polonia e Romania"], a:0, e:"Francia 16,9%, Italia 14,2%, Germania 13,5%, Spagna 10,5%: l’Italia è il secondo produttore agricolo europeo.", s:"slide 11"},
  {l:2, q:"Come si distribuiscono gli agricoltori europei per specializzazione produttiva?", o:["52,5% colture, 25,1% allevamenti, 21,1% misti, 1,3% non classificabili","25,1% colture, 52,5% allevamenti, 21,1% misti","33% colture, 33% allevamenti, 33% misti","70% colture, 20% allevamenti, 10% misti"], a:0, e:"Oltre metà degli agricoltori è specializzata in colture; un quarto in allevamenti; un quinto è misto.", s:"slide 13 e 14"},
  {l:2, q:"Tra le aziende specializzate in colture, qual è la sottocategoria più numerosa?", o:["Colture permanenti (18,9%)","Colture da taglio (31,6%)","Orticolture (1,8%)","Colture e pascoli combinati (2,8%)"], a:1, e:"Colture da taglio 31,6%, colture permanenti 18,9%, orticolture 1,8%.", s:"slide 14"},
  {l:2, q:"Tra le aziende specializzate in allevamenti, qual è la sottocategoria più numerosa?", o:["Bovini da latte (5,4%)","Ovi-caprini (6,2%)","Polli (4,5%)","Maiali (1,5%)"], a:1, e:"Ovi-caprini 6,2%, bovini da latte 5,4%, polli 4,5%, vitelli 3,9%, mix avicoli 2,6%, maiali 1,5%, mix bovini carne-latte 1,1%.", s:"slide 14"},
  {l:2, q:"In quali Paesi la tipologia di azienda predominante è quella specializzata in colture (oltre il 60% degli agricoltori)?", o:["Benelux, Regno Unito e Irlanda","Italia, Spagna, Grecia, Cipro (e Finlandia)","Portogallo, Romania e Bulgaria","Austria e Norvegia"], a:1, e:"Nei Paesi mediterranei (Italia, Spagna, Grecia, Cipro) e in Finlandia.", s:"slide 15"},
  {l:2, q:"In quali Paesi prevale la specializzazione zootecnica (oltre il 50% degli agricoltori)?", o:["Paesi mediterranei","Paesi del nord-ovest: Benelux, Regno Unito, Irlanda, Norvegia e Austria","Romania, Bulgaria e Croazia","Spagna e Portogallo"], a:1, e:"Nord-ovest europeo e Austria. Le aziende miste (30%) sono tipiche di Portogallo, Romania, Bulgaria, Lituania e Croazia.", s:"slide 15"},
  {l:2, q:"Qual è il primo produttore europeo di cereali?", o:["Germania (45,6 mln t)","Polonia (31,9 mln t)","Francia (68,5 mln t, 22% del totale UE)","Italia"], a:2, e:"Produzione UE-28 di 309,9 mln t: Francia 22%, Germania 14,7%, Polonia 10,3%.", s:"slide 16"},
  {l:2, q:"Quale cereale rappresenta la quota maggiore della produzione europea?", o:["Mais da granella (20,9%)","Orzo (18,9%)","Grano tenero e farro (40%)","Avena (2,6%)"], a:2, e:"Grano tenero e farro 40%, mais 20,9%, orzo 18,9%, avena 2,6%, miscele di segale e cereali invernali 2,5%, altri 9%.", s:"slide 16"},
  {l:2, q:"A quanto ammonta il patrimonio bovino dell’UE-28?", o:["Circa 12,7 milioni di capi","Circa 88,4 milioni di capi","Circa 150 milioni di capi","Circa 86,6 milioni di capi"], a:1, e:"Bovini 88,4 mln; suini 150 mln; pecore 86,6 mln; capre 12,7 mln.", s:"slide 18-20"},
  {l:2, q:"Qual è il Paese con il maggior patrimonio bovino in Europa?", o:["Germania (12,3 mln)","Francia (18,6 mln)","Regno Unito (9,8 mln)","Irlanda (6,7 mln)"], a:1, e:"Francia 18,6 mln, Germania 12,3, Regno Unito 9,8, Irlanda 6,7, Spagna 6,5, Italia 6,3, Polonia 6.", s:"slide 18"},
  {l:2, q:"A quanto ammonta il patrimonio suino dell’UE-28 e quale Paese ne detiene la quota maggiore?", o:["150 milioni; Spagna (30 mln)","88,4 milioni; Francia","150 milioni; Danimarca (12,8 mln)","86,6 milioni; Germania"], a:0, e:"Spagna 30 mln, Germania 27,6, Francia 13,1, Danimarca 12,8, Paesi Bassi 12,3, Polonia 11,9, Italia 8,6.", s:"slide 19"},
  {l:2, q:"Quale Paese ha il maggior numero di pecore nell’UE-28?", o:["Spagna (16 mln)","Romania (10 mln)","Regno Unito (23,3 mln)","Grecia (8,6 mln)"], a:2, e:"Regno Unito 23,3 mln su 86,6 totali; poi Spagna 16, Romania 10, Grecia 8,6, Italia 7,2, Francia 6,9.", s:"slide 20"},
  {l:2, q:"Quale Paese ha il maggior numero di capre nell’UE-28?", o:["Grecia (3,8 mln)","Spagna (3,1 mln)","Francia (1,2 mln)","Italia (1 mln)"], a:0, e:"Grecia 3,8 mln su 12,7 totali; poi Spagna 3,1, Romania 1,5, Francia 1,2, Italia 1.", s:"slide 20"},
  {l:2, q:"Tra il 2010 e il 2017, quale specie ha visto crescere di più le consistenze nell’UE-28?", o:["Pecore","Capre","Bovini","Maiali"], a:3, e:"Maiali in crescita (circa +4%), bovini sostanzialmente stabili con leggero aumento, pecore e capre in calo (circa -2% e -3%).", s:"slide 21"},
  {l:2, q:"Quanta carne bovina (bovini adulti e vitelli) si produce nell’UE-28?", o:["0,8 milioni di t","7,8 milioni di t","13,2 milioni di t","23,4 milioni di t"], a:1, e:"7,8 mln t. Nel 2017 la produzione è rimasta invariata ma il prezzo è aumentato (+2,2% 2017 vs 2016; +10% 2013 vs 2010).", s:"slide 22"},
  {l:2, q:"Quali tre Paesi producono circa la metà della carne di bovini adulti dell’UE?", o:["Spagna, Paesi Bassi e Francia","Francia, Germania e Regno Unito","Italia, Polonia e Irlanda","Germania, Danimarca e Polonia"], a:1, e:"Francia 18,4%, Germania 15,8%, Regno Unito 13,2%.", s:"slide 22"},
  {l:2, q:"Quali tre Paesi producono i due terzi della carne di vitello dell’UE?", o:["Francia, Germania e Regno Unito","Spagna, Paesi Bassi e Francia","Italia, Spagna e Grecia","Polonia, Germania e Danimarca"], a:1, e:"Spagna 25,1%, Paesi Bassi 23,0%, Francia 19,3%; l’Italia è quarta con il 10,2%.", s:"slide 22 e 26"},
  {l:2, q:"Come si posiziona l’Italia nella produzione europea di carne di vitello e di manzo?", o:["Prima in entrambe","Vitello 10,2% (quarta), manzo 9,6% (quarta dopo Francia, Germania e Regno Unito)","Ultima in entrambe","Vitello 25,1%, manzo 18,4%"], a:1, e:"Vitello: Spagna 25,1%, Paesi Bassi 23%, Francia 19,3%, Italia 10,2%. Manzo: Francia 18,4%, Germania 15,8%, Regno Unito 13,2%, Italia 9,6%, Irlanda 9,1%.", s:"slide 26"},
  {l:2, q:"Quanta carne suina si produce nell’UE-28 e come è variata nel 2017?", o:["23,4 milioni di t, in calo del 9% rispetto al 2016 ma con prezzo molto aumentato","7,8 milioni di t, invariata","13,2 milioni di t, +0,5%","0,8 milioni di t, +1,7%"], a:0, e:"23,4 mln t (-9% sul 2016, ma circa 1 mln t in più rispetto al 2013); prezzo +8,3% 2017 vs 2015.", s:"slide 23"},
  {l:2, q:"Quale Paese produce da solo circa un quarto della carne suina europea?", o:["Spagna (18,4%)","Germania (23,3%)","Francia (9,3%)","Polonia (8,5%)"], a:1, e:"Germania 23,3%; la Spagna è seconda con circa un quinto (18,4%).", s:"slide 23"},
  {l:2, q:"Qual è la posizione dell’Italia nella produzione europea di carne suina?", o:["Prima (23,3%)","Seconda (18,4%)","Sesta (6,3%)","Decima (2%)"], a:2, e:"Germania 23,3%, Spagna 18,4%, Francia 9,3%, Polonia 8,5%, Danimarca 6,5%, Italia 6,3%.", s:"slide 27"},
  {l:2, q:"La produzione europea di carne ovi-caprina è di circa 0,8 milioni di t. Quale quota è rappresentata dalla carne ovina?", o:["50%","75%","92,5%","99%"], a:2, e:"Il 92,5% è carne ovina. Produzione +1,7% rispetto al 2016, ma prezzi in calo (-1,4%).", s:"slide 24"},
  {l:2, q:"Qual è il primo produttore europeo di carne ovi-caprina?", o:["Spagna (16,4%)","Regno Unito (39%)","Francia (11,3%)","Grecia (9,3%)"], a:1, e:"Regno Unito 39%, Spagna 16,4%, Francia 11,3%, Grecia 9,3%, Irlanda 8,7%: cinque Stati membri coprono la maggior parte della produzione.", s:"slide 24"},
  {l:2, q:"Quanta carne di pollo si produce nell’UE e qual è il trend dal 2010?", o:["13,2 mln t, +20,7% cumulato dal 2010","7,8 mln t, invariata","23,4 mln t, -9%","0,8 mln t, +1,7%"], a:0, e:"13,2 mln t, +0,5% rispetto al 2016 e +20,7% dal 2010. Nel 2013-2016 i prezzi erano bassi (anche per il basso prezzo dei mangimi); oggi risaliti di circa l’1%.", s:"slide 25"},

const LETTERS = ["A","B","C","D"];
const $ = (id) => document.getElementById(id);

const state = { queue: [], idx: 0, answers: [], shuffleOpts: true };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildStart() {
  const counts = {1:0, 2:0, 3:0};
  BANK.forEach(x => counts[x.l]++);
  const wrap = $("lessonChoices");
  const items = [
    {v:"all", label:"Tutte le lezioni", n:BANK.length},
    {v:"1", label:"Lezione 1: " + LESSONS[1], n:counts[1]},
    {v:"2", label:"Lezione 2: " + LESSONS[2], n:counts[2]},
    {v:"3", label:"Lezione 3: " + LESSONS[3], n:counts[3]}
  ];
  wrap.innerHTML = items.map((it, i) =>
    `<label class="choice"><input type="radio" name="lesson" value="${it.v}" ${i === 0 ? "checked" : ""}> <span>${it.label}</span><span class="count">${it.n} domande</span></label>`
  ).join("");
}

function prepare(items) {
  return items.map(item => {
    let order = [0,1,2,3];
    if (state.shuffleOpts) order = shuffle(order);
    return {
      item,
      opts: order.map(i => item.o[i]),
      correct: order.indexOf(item.a)
    };
  });
}

function startQuiz(items, random) {
  state.shuffleOpts = $("shuffleOpts").checked;
  state.queue = prepare(random ? shuffle(items) : items);
  state.idx = 0;
  state.answers = [];
  $("start").hidden = true;
  $("results").hidden = true;
  $("quiz").hidden = false;
  render();
  window.scrollTo({top: 0});
}

function render() {
  const n = state.queue.length;
  const cur = state.queue[state.idx];
  $("bar").style.width = ((state.idx) / n * 100) + "%";
  $("lessonTag").textContent = "Lezione " + cur.item.l + ": " + LESSONS[cur.item.l];
  $("counter").textContent = "Domanda " + (state.idx + 1) + " di " + n;
  $("qText").textContent = cur.item.q;
  const box = $("options");
  box.innerHTML = "";
  cur.opts.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.innerHTML = `<span class="key">${LETTERS[i]}</span><span>${text}</span>`;
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });
  $("feedback").hidden = true;
  $("nextActions").hidden = true;
  $("nextBtn").textContent = state.idx === n - 1 ? "Vedi il risultato" : "Avanti";
  box.querySelector(".opt").focus({preventScroll: true});
}

function choose(i) {
  const cur = state.queue[state.idx];
  if (state.answers[state.idx] !== undefined) return;
  const ok = i === cur.correct;
  state.answers[state.idx] = {chosen: i, ok};
  const buttons = $("options").querySelectorAll(".opt");
  buttons.forEach((b, k) => {
    b.disabled = true;
    if (k === cur.correct) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  const fb = $("feedback");
  fb.classList.toggle("bad", !ok);
  $("verdict").textContent = ok ? "Corretto." : "Sbagliato. La risposta corretta è " + LETTERS[cur.correct] + ": " + cur.opts[cur.correct];
  $("explain").textContent = cur.item.e;
  $("ref").textContent = "Lezione " + cur.item.l + ", " + cur.item.s;
  fb.hidden = false;
  $("nextActions").hidden = false;
  $("nextBtn").focus({preventScroll: true});
}

function next() {
  if (state.answers[state.idx] === undefined) return;
  if (state.idx < state.queue.length - 1) {
    state.idx++;
    render();
    $("quiz").scrollIntoView({block: "start"});
  } else {
    showResults();
  }
}

function showResults() {
  $("quiz").hidden = true;
  $("results").hidden = false;
  const n = state.queue.length;
  const right = state.answers.filter(a => a.ok).length;
  const pct = Math.round(right / n * 100);
  $("scoreLine").textContent = right + " su " + n;
  $("scoreSub").textContent = "Risposte corrette: " + pct + "%.";

  const per = {};
  state.queue.forEach((q, k) => {
    const l = q.item.l;
    per[l] = per[l] || {n: 0, ok: 0};
    per[l].n++;
    if (state.answers[k].ok) per[l].ok++;
  });
  const lessons = Object.keys(per).sort();
  if (lessons.length > 1) {
    $("byLesson").hidden = false;
    $("byLesson").innerHTML = "<tr><th>Lezione</th><th class=\"num\">Corrette</th><th class=\"num\">Domande</th><th class=\"num\">Percentuale</th></tr>" +
      lessons.map(l => `<tr><td>Lezione ${l}: ${LESSONS[l]}</td><td class="num">${per[l].ok}</td><td class="num">${per[l].n}</td><td class="num">${Math.round(per[l].ok / per[l].n * 100)}%</td></tr>`).join("");
  } else {
    $("byLesson").hidden = true;
  }

  const errs = state.queue.map((q, k) => ({q, a: state.answers[k]})).filter(x => !x.a.ok);
  const list = $("errors");
  if (errs.length === 0) {
    $("errorsWrap").hidden = true;
    $("retryErrors").hidden = true;
  } else {
    $("errorsWrap").hidden = false;
    $("retryErrors").hidden = false;
    list.innerHTML = errs.map(x =>
      `<li><div class="lesson">Lezione ${x.q.item.l}, ${x.q.item.s}</div><div class="q">${x.q.item.q}</div><div class="yours">La tua risposta: ${x.q.opts[x.a.chosen]}</div><div class="right">Risposta corretta: ${x.q.opts[x.q.correct]}</div></li>`
    ).join("");
  }
  window.scrollTo({top: 0});
}

$("startBtn").addEventListener("click", () => {
  const v = document.querySelector("input[name=lesson]:checked").value;
  const items = v === "all" ? BANK : BANK.filter(x => String(x.l) === v);
  startQuiz(items, $("randomOrder").checked);
});
$("nextBtn").addEventListener("click", next);
$("retryErrors").addEventListener("click", () => {
  const items = state.queue.filter((q, k) => !state.answers[k].ok).map(q => q.item);
  startQuiz(items, false);
});
$("restart").addEventListener("click", () => {
  $("results").hidden = true;
  $("quiz").hidden = true;
  $("start").hidden = false;
  window.scrollTo({top: 0});
});

document.addEventListener("keydown", (ev) => {
  if ($("quiz").hidden) return;
  if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
  const k = ev.key;
  if (k >= "1" && k <= "4") {
    const i = Number(k) - 1;
    if (i < state.queue[state.idx].opts.length && state.answers[state.idx] === undefined) {
      ev.preventDefault();
      choose(i);
    }
  } else if (k === "Enter" && state.answers[state.idx] !== undefined) {
    ev.preventDefault();
    next();
  }
});

buildStart();
</script>
</body>
</html>
